<!-- Front-page template — Halyard's signature dated-edition layout, distinct
     from the generic post index Colophon ships. Composes the edition-masthead
     and on-the-water patterns per the design brief's front-page-as-periodical
     signature feature.

     Colophon's own core deliberately has NO front-page.html (removed in
     1.6252.1241 after a WP.org rejection): it always wins over index.html,
     including under the default "Your latest posts" setting, and a version
     built around wp:post-content has no post context there, so it shipped
     blank. This template does not use wp:post-content or any post-context
     block — every pattern here is static demo content — so it renders
     correctly whether or not the site owner assigns a static front page.
     Do not port Colophon's front-page.html removal back onto this file
     without re-checking that assumption still holds. -->
